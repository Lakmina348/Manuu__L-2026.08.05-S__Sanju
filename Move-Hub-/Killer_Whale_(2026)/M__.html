    togglePlay();
  };

  let lastTap = 0, tapTimer;
  touchArea.addEventListener('click', (e) => {
    const now = Date.now();
    const rect = touchArea.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;

    if (now - lastTap < 300) {
      clearTimeout(tapTimer);
      if (x < 0.35) skip(-10);
      else if (x > 0.65) skip(10);
      else togglePlay();
      lastTap = 0;
    } else {
      lastTap = now;
      tapTimer = setTimeout(togglePlay, 300);
    }
  });

  video.addEventListener('play', () => {
    document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    centerPlay.style.display = 'none';
  });

  video.addEventListener('pause', () => {
    document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"/>';
    centerPlay.style.display = 'grid';
  });

  window.addEventListener('keydown', (e) => {
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return;

    if (e.code === 'Space' || e.keyCode === 32) {
      e.preventDefault();
      togglePlay();
    } else if (e.code === 'ArrowRight') {
      e.preventDefault();
      skip(10);
    } else if (e.code === 'ArrowLeft') {
      e.preventDefault();
      skip(-10);
    } else if (e.code === 'ArrowUp') {
      e.preventDefault();
      changeVolume(0.1);
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      changeVolume(-0.1);
    } else if (e.code === 'KeyF') {
      e.preventDefault();
      toggleFullscreen();
    }
  });

  // Gestures (Brightness / Volume)
  let isDragging = false, startY = 0, initialVal = 0, dragSide = '';
  let currentBrightness = 1;

  const bOverlay = document.getElementById('brightnessOverlay');
  const leftBadge = document.getElementById('leftBadge');
  const rightBadge = document.getElementById('rightBadge');

  touchArea.addEventListener('pointerdown', (e) => {
    isDragging = true;
    startY = e.clientY;
    const rect = touchArea.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    dragSide = x < 0.5 ? 'left' : 'right';

    if (dragSide === 'left') {
      initialVal = currentBrightness;
      leftBadge.style.display = 'block';
    } else {
      initialVal = video.volume;
      rightBadge.style.display = 'block';
    }
    touchArea.setPointerCapture(e.pointerId);
  });

  touchArea.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const deltaY = startY - e.clientY;
    const change = deltaY / 200;

    if (dragSide === 'left') {
      let newB = Math.max(0.1, Math.min(1, initialVal + change));
      currentBrightness = newB;
      bOverlay.style.opacity = (1 - currentBrightness) * 0.85;
      leftBadge.textContent = '☀️ Brightness: ' + Math.round(currentBrightness * 100) + '%';
    } else {
      let newV = Math.max(0, Math.min(1, initialVal + change));
      video.volume = newV;
      bottomVolumeSlider.value = newV;
      rightBadge.textContent = '🔊 Volume: ' + Math.round(video.volume * 100) + '%';
    }
  });

  const stopDrag = () => {
    if (!isDragging) return;
    isDragging = false;
    leftBadge.style.display = 'none';
    rightBadge.style.display = 'none';
  };

  touchArea.addEventListener('pointerup', stopDrag);
  touchArea.addEventListener('pointercancel', stopDrag);

  function changeVolume(delta) {
    let newV = Math.max(0, Math.min(1, video.volume + delta));
    video.volume = newV;
    bottomVolumeSlider.value = newV;
    rightBadge.textContent = '🔊 Volume: ' + Math.round(newV * 100) + '%';
    rightBadge.style.display = 'block';
    setTimeout(() => { if (!isDragging) rightBadge.style.display = 'none'; }, 1000);
  }

  bottomVolumeSlider.addEventListener('input', (e) => {
    video.volume = e.target.value;
  });

  document.getElementById('btnMute').onclick = () => {
    video.muted = !video.muted;
    bottomVolumeSlider.value = video.muted ? 0 : video.volume;
  };

  btnSettings.onclick = (e) => {
    e.stopPropagation();
    settingsMenu.classList.toggle('active');
  };

  document.addEventListener('click', () => settingsMenu.classList.remove('active'));

  function changeQuality(q) {
    if (CONFIG.videos[q]) {
      const curTime = video.currentTime;
      const isPlay = !video.paused;
      video.src = CONFIG.videos[q];
      video.currentTime = curTime;
      if (isPlay) video.play();

      document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
    }
  }

  async function toggleFullscreen() {
    if (!document.fullscreenElement) {
      if (player.requestFullscreen) await player.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock('landscape'); } catch (err) {}
      }
    } else {
      if (document.exitFullscreen) await document.exitFullscreen();
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }
  }

  document.getElementById('btnFullscreen').onclick = toggleFullscreen;

  async function sendComment() {
    const name = document.getElementById('cName').value.trim() || 'අනනාමික පරිශීලක';
    const phone = document.getElementById('cPhone').value.trim() || 'ලබා දී නැත';
    const text = document.getElementById('cText').value.trim();

    if (!text) {
      alert('කරුණාකර අදහසක් ඇතුළත් කරන්න!');
      return;
    }

    const list = document.getElementById('commentList');
    const item = document.createElement('div');
    item.className = 'single-comment';
    item.innerHTML = `
      <div class="c-avatar">👤</div>
      <div>
        <div style="font-weight: bold; font-size: 13px; color: var(--text-dim);">${name}</div>
        <div style="font-size: 14px; margin-top: 4px;">${text}</div>
      </div>
    `;
    list.prepend(item);

    document.getElementById('cText').value = '';

    const telegramMsg = `💬 <b>නව VideoLAN අදහසක්!</b>\n\n👤 නම: ${name}\n📞 දුරකථන අංකය: ${phone}\n✍️ පණිවිඩය:\n${text}`;

    try {
      await fetch(`https://api.telegram.org/bot${CONFIG.botToken}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CONFIG.chatId, text: telegramMsg, parse_mode: 'HTML' })
      });
    } catch (e) {}
  }
</script>

</body>
