<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Verification & Key Verification | Lakmina Cinema</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #07090e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .key-card {
            background: rgba(18, 24, 38, 0.9);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(10px);
        }

        .lock-icon {
            font-size: 45px;
            margin-bottom: 15px;
            display: inline-block;
        }

        h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        p {
            font-size: 12px;
            color: #a0aec0;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #00ffcc;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .input-box:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #e50914, #ff0055);
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 11px;
            margin-top: 12px;
            display: none;
        }

        .footer-back {
            margin-top: 20px;
            display: block;
            color: #718096;
            text-decoration: none;
            font-size: 11px;
        }

        .footer-back:hover {
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="key-card">
        <div class="lock-icon">🔞</div>
        <h2>කරුනාකර ඔබගේ මුරපදය ඇතුළත් කරන්න</h2>
        <p>මුරපදය නැතිනම් Home පිටුවෙ ඇති 𝐋𝐨𝐠𝐢𝐧 වෙත ගොස් අලුත් ගිනුමක් සාදා ගන්න.</p>
        <p>නැතහොත් පහලම ඇති ( ← ගිනුමක් සාදා ගන්න ) වෙත යන්න.</p>

        <input type="password" id="passKey" class="input-box" placeholder="මුරපදය ඇතුලත් කරන්න">
        <button class="btn-submit" onclick="verifyAccess()">ප්‍රවේශ වන්න</button>

        <div id="errorMsg" class="error-msg">❌ ඇතුළත් කළ මුරපදය වැරදියි! නැවත උත්සාහ කරන්න.</div>

        <a href="Login.html" class="footer-back">← ගිනුමක් සාදා ගන්න</a>
    </div>

    <script>
        function verifyAccess() {
            const enteredKey = document.getElementById('passKey').value;
            
            // ඔබට අවශ්‍ය සියලුම මුරපද මෙහි Array එකක් ලෙස අඩංගු කර ඇත
            const validKeys = ["1818", "7fghhf89456", "22fghfdg55", "4gng455", "220ghdg0", "5gfng874"];

            // ලබා දුන් මුරපදය validKeys අරාව (Array) තුළ තිබේදැයි පරීක්ෂා කිරීම
            if (validKeys.includes(enteredKey)) {
                // අවසර ලබා දුන් බව බ්‍රවුසරයේ සුරැකීම
                localStorage.setItem('vip_unlocked', 'true');

                // පරිශීලකයා බලන්නට පැමිණි අදාළ චිත්‍රපටයට යොමු කිරීම
                const targetMovie = localStorage.getItem('target_movie');
                if (targetMovie) {
                    localStorage.removeItem('target_movie');
                    window.location.href = targetMovie;
                } else {
                    window.location.href = 'home1.html';
                }
            } else {
                // මුරපදය වැරදි නම් දෝෂ පණිවිඩය පෙන්වීම
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
